name: FitGiriş CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Go Backend Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Codebase Checkout
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Backend Compilation
        run: |
          cd backend
          go build -v ./...

      - name: Verify Simulator Compilation
        run: |
          cd simulator
          go build -v ./...

      - name: Run Backend Unit & Concurrency Tests
        run: |
          cd backend
          go test -v -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: backend
          args: --timeout=5m
