services:
  postgres:
    image: postgres:16-alpine
    container_name: fitgiris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fitgiris}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fitgiris}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - fitgiris-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitgiris-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-fitgiris}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-fitgiris-super-secret-key-change-in-production-32chars}
      ENVIRONMENT: production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - fitgiris-net

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fitgiris-simulator
    restart: unless-stopped
    environment:
      SIMULATOR_SEED: ${SIMULATOR_SEED:-42}
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fitgiris-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitgiris-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fitgiris-net

  adminer:
    image: adminer:latest
    container_name: fitgiris-adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fitgiris-net

  verify:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitgiris-verify
    profiles:
      - verify
    environment:
      API_URL: http://backend:8080
    entrypoint: ["./fitgiris-verify"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fitgiris-net

volumes:
  pgdata:

networks:
  fitgiris-net:
    driver: bridge
